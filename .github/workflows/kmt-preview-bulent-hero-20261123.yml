name: Preview Bülent-only home hero retouch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kmt-preview-bulent-hero-20261123.yml'
      - 'scripts/kmt_patch_bulent_hero_20261123.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kmt-bulent-hero-preview-20261123
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install imaging dependency
        run: python -m pip -q install Pillow==11.3.0
      - name: Validate original layout and preview retouch
        run: python scripts/kmt_patch_bulent_hero_20261123.py
      - name: Commit verified assets after reviewing preview
        if: success() # image inspected and pixel-bound validation passed
        run: |
          git add -- assets/home/kmt-hero-bulent-detail-1280-20261123.webp assets/home/kmt-hero-bulent-detail-720-20261123.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Only improve Bülent portrait and approved tattoo; keep Burcu/template'
          git push origin HEAD:main
