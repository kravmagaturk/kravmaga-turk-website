name: KMT assistant regression and targeted deploy
on:
  push:
    branches: [main]
    paths:
      - 'assistant-worker/src/worker.js'
      - 'assistant-worker/widget-delivery/worker.js'
      - 'assets/kmt-assistant.js'
      - 'assistant-worker/wrangler.toml'
      - 'cloudflare/instructor-lookup/worker.js'
      - '.github/workflows/kmt-assistant-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kmt-assistant-targeted-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test actual source and widget parity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const worker=fs.readFileSync('assistant-worker/src/worker.js','utf8');
          const widget=fs.readFileSync('assets/kmt-assistant.js','utf8');
          const delivery=fs.readFileSync('assistant-worker/widget-delivery/worker.js','utf8');
          const kb=JSON.parse(fs.readFileSync('assets/kmt-assistant-knowledge.json','utf8'));
          const sandbox={fetch:async u=>{
            assert.equal(u,'https://kravmaga.com.tr/assets/kmt-assistant-knowledge.json');
            return new Response(JSON.stringify(kb),{headers:{'content-type':'application/json'}});
          },Response,URL,console};
          vm.createContext(sandbox);
          vm.runInContext(worker.replace('export default {','globalThis.worker = {'),sandbox);
          const client=vm.createContext({});
          new vm.Script(widget);
          vm.runInContext(widget.slice(widget.indexOf('  function normalized(s)'),widget.indexOf('  function fallback(q)')),client);
          const questions=['hangi saatler antrenman','Antrenman hangi günler?','antreman saatleri','Dersler ne zaman?','Grup dersleri hangi günler ve saat kaçta?','İdman programı'];
          for(const q of questions){
            assert.equal(sandbox.scheduleQuestion(q),true,q);
            assert.match(client.scheduleCard(q).answer,/Salı ve Perşembe/);
            const result=await sandbox.compose(q,[],'tr',{});
            assert.equal(result.mode,'academy_knowledge');
            assert.equal(result.sources[0].id,'group');
            assert.match(result.answer,/19.30/);
          }
          for(const q of ['Çocuk antrenman saatleri','Özel ders saatleri','Bugün antrenman iptal mi?','Eyal Yanilov kimdir?','Ders kaç saat sürüyor?']){
            assert.equal(sandbox.scheduleQuestion(q),false,q);
            assert.equal(client.scheduleCard(q),null,q);
          }
          assert.equal(JSON.parse(delivery.split('\n')[1].slice('const JAVASCRIPT='.length,-1)),widget);
          const lookup=fs.readFileSync('cloudflare/instructor-lookup/worker.js','utf8');
          const roster=vm.createContext({WorkerEntrypoint:class{}});
          vm.runInContext(lookup.replace(/import[^\n]+\n/,'').replace('export default {','globalThis.lookup = {').replace('export class AssistantRoster','class AssistantRoster'),roster);
          const rows={
            a:{name:'Test Faal',status:'faal',role:'instructor',publishInAssistant:true},
            b:{name:'Test Pasif',status:'pasif',role:'instructor',publishInAssistant:true},
            c:{name:'Test Asistan',status:'faal',role:'asistan',publishInAssistant:true},
            d:{name:'Test Onaysiz',status:'faal',role:'instructor'},
            e:{name:'Test Durumsuz',role:'instructor',publishInAssistant:true},
            f:{name:'Test Temsilci',status:'faal',role:'temsilci',publishInAssistant:true}
          };
          assert.deepEqual(Array.from(roster.approvedInstructorNames(rows)),['Test Faal']);
          const question='aktif yetkili antrenörlerin ismini ver';
          assert.equal(sandbox.rosterQuestion(question,'tr'),true);
          assert.equal(sandbox.rosterQuestion('pasif antrenörler kimler','tr'),false);
          const answer=await sandbox.compose(question,[],'tr',{INSTRUCTOR_ROSTER:{activeNames:async()=>({names:['Test Faal']})}});
          assert.equal(answer.mode,'academy_roster');
          assert.match(answer.answer,/Test Faal/);
          assert.equal((await sandbox.compose(question,[],'tr',{})).mode,'registry_unavailable');
          assert.equal((await sandbox.compose(question,[],'tr',{INSTRUCTOR_ROSTER:{activeNames:async()=>({names:[]})}})).mode,'academy_roster');
          console.log('PASS: roster approval, active status, instructor role, and unavailable registry');
          console.log('PASS: Turkish schedule intent, exclusions, exact knowledge entry and widget parity');
          JS
      - name: Deploy instructor RPC and assistant Workers, then verify live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Cloudflare token unavailable to this job."; fi
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare account ID unavailable to this job."; fi
            exit 1
          fi
          npx --yes wrangler@4 deploy --config cloudflare/instructor-lookup/wrangler.toml --keep-vars
          npx --yes wrangler@4 deploy --config assistant-worker/wrangler.toml --keep-vars
          npx --yes wrangler@4 deploy --config assistant-worker/widget-delivery/wrangler.toml --keep-vars
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const js=await fetch('https://kravmaga.com.tr/assets/kmt-assistant.js?v=20261124-fix',{cache:'no-store'});
          assert.ok(js.ok);
          assert.match(await js.text(),/function scheduleCard/);
          const res=await fetch('https://kravmaga.com.tr/api/kmt-research',{
            method:'POST',headers:{'Content-Type':'application/json',Origin:'https://kravmaga.com.tr'},
            body:JSON.stringify({message:'hangi saatler antrenman',language:'tr',history:[]})
          });
          assert.ok(res.ok);
          const data=await res.json();
          assert.match(data.answer,/19[.:]30/);
          assert.equal(data.mode,'academy_knowledge');
          const rosterRes=await fetch('https://kravmaga.com.tr/api/kmt-research',{
            method:'POST',headers:{'Content-Type':'application/json',Origin:'https://kravmaga.com.tr'},
            body:JSON.stringify({message:'aktif yetkili antrenörlerin ismini ver',language:'tr',history:[]})
          });
          assert.ok(rosterRes.ok);
          const rosterData=await rosterRes.json();
          assert.equal(rosterData.mode,'academy_roster');
          console.log('PASS: public widget and live API regression');
          JS

  live-audit:
    needs: test-and-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current public endpoints without credentials
        run: |
          node --input-type=module <<'JS'
          const base='https://kravmaga.com.tr';
          const js=await fetch(base+'/assets/kmt-assistant.js?v=20261124-audit',{signal:AbortSignal.timeout(15000)});
          console.log('Live widget HTTP:',js.status,'updated:',/function scheduleCard/.test(await js.text()));
          for(const [label,message,mode] of [
            ['schedule','hangi saatler antrenman','academy_knowledge'],
            ['roster','aktif yetkili antrenörlerin ismini ver','academy_roster']
          ]){
            try {
              const res=await fetch(base+'/api/kmt-research',{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify({message,language:'tr',history:[]}),signal:AbortSignal.timeout(25000)});
              const data=await res.json();
              console.log(label,'HTTP:',res.status,'mode:',String(data.mode||'unknown'),'updated:',res.ok&&data.mode===mode,'schedule_correct:',label==='schedule'&&/19[.:]30/.test(data.answer||''));
            }catch(e){console.log(label,'probe unavailable:',e.name);}
          }
          JS
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Verify desktop and mobile live widget behavior
        run: |
          node --input-type=module <<'JS'
          import {chromium,devices} from 'playwright';
          const browser=await chromium.launch({headless:true});
          let failed=false;
          for(const [label,options] of [['desktop',{viewport:{width:1440,height:900}}],['mobile',{...devices['iPhone 13']}]]) {
            const context=await browser.newContext(options);
            const page=await context.newPage();
            try{
              const res=await page.goto('https://kravmaga.com.tr/',{waitUntil:'load',timeout:30000});
              const launch=page.locator('.kmt-ai-launch');
              await launch.waitFor({state:'visible',timeout:15000});
              await launch.click();
              const panel=page.locator('.kmt-ai-panel');
              await panel.waitFor({state:'visible',timeout:10000});
              const layout=await panel.evaluate(e=>{const r=e.getBoundingClientRect();return r.left>=-2&&r.top>=-2&&r.right<=innerWidth+2&&r.bottom<=innerHeight+2});
              const input=panel.locator('input');
              const bots=panel.locator('.kmt-ai-msg.bot');
              const ask=async(q)=>{
                const before=await bots.count();
                await input.fill(q);
                await panel.locator('button[type="submit"]').click();
                await bots.nth(before).waitFor({timeout:30000});
                return await bots.nth(before).innerText();
              };
              const schedule=await ask('hangi saatler antrenman');
              const scheduleOK=/19[.:]30/.test(schedule)&&/Salı/i.test(schedule);
              const roster=await ask('aktif yetkili antrenörlerin ismini ver');
              const rosterOK=/yayımlanmasına izin verdiği faal yetkili antrenörler/i.test(roster);
              const rosterEmpty=/yayımlanması onaylanmış faal antrenör ismi bulunmuyor/i.test(roster);
              console.log(JSON.stringify({label,http:res.status(),panelVisible:true,withinViewport:layout,scheduleOK,rosterOK,rosterEmpty,seoTitlePresent:!!(await page.title()),seoDescriptionPresent:!!(await page.locator('meta[name="description"]').getAttribute('content').catch(()=>null))}));
              if(!res.ok()||!layout||!scheduleOK||!rosterOK)failed=true;
            }catch(e){failed=true;console.log(label,'browser verification incomplete:',e.name);}
            finally{await context.close();}
          }
          await browser.close();
          if(failed)process.exitCode=1;
          JS
