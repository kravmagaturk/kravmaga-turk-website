name: TRANSFER Localize External Assets

on:
  push:
    branches:
      - transfer-test
    paths:
      - ".github/workflows/localize-external-assets.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transfer-test
          fetch-depth: 0

      - name: Download external images into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/home assets/documents

          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/download-IBYGw0atkOLWkGA3.png" -o assets/home/egitim-secenekleri.png
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/darca1_copy-mk3vov34B7Tplg9m.jpg" -o assets/home/ugur-tatar.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/burcu-4-3GOUbmzg9UIYsBZI.jpg" -o assets/home/burcu-ergulen.jpg

          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/dan-YbNbGw1aL8cNg2jk.jpg" -o assets/documents/muay-thai-sicil.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/turk-AoPDlkbbLpCaMlej.jpg" -o assets/documents/tpe-marka-tescil.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/kmg_instructor-mjEzyNMbe4iv21yW.jpg" -o assets/documents/kmg-instructor.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/tae-kwon-do-ZOxHx3LFqIRrBhnH.png" -o assets/documents/taekwondo.png
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/km-mxBzQOvbP5Fevq5W.jpg" -o assets/documents/kmf.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/muay-thai-YIGpmsQ8iBjvRoQX.png" -o assets/documents/muay-thai-hakem.png
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/a--cts-ALp8v5EWKLtknr9l.jpg" -o assets/documents/icts.jpg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/esa02-9wAdV4apCaJY96OH.png" -o assets/documents/esa.png
          curl -fL --retry 3 -A "Mozilla/5.0" "https://assets.zyrosite.com/mePyW7BezQcoMDkG/grd-1_kmg-AwvOZa7b3yIe2k1K.jpg" -o assets/documents/kmg-graduate.jpg

          test -s assets/home/egitim-secenekleri.png
          test -s assets/home/ugur-tatar.jpg
          test -s assets/home/burcu-ergulen.jpg
          test -s assets/documents/muay-thai-sicil.jpg
          test -s assets/documents/tpe-marka-tescil.jpg
          test -s assets/documents/kmg-instructor.jpg
          test -s assets/documents/taekwondo.png
          test -s assets/documents/kmf.jpg
          test -s assets/documents/muay-thai-hakem.png
          test -s assets/documents/icts.jpg
          test -s assets/documents/esa.png
          test -s assets/documents/kmg-graduate.jpg

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Krav Maga Turk TRANSFER"
          git config user.email "actions@users.noreply.github.com"
          git add assets/home assets/documents
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "TRANSFER: ana sayfa ve belgeler gorsellerini yerellestir"
            git push origin HEAD:transfer-test
          fi
