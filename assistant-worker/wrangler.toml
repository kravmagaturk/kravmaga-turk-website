workers_dev = true

routes = [
  { pattern = "kravmaga.com.tr/api/kmt-research*", zone_name = "kravmaga.com.tr" }
]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "d0cb4699c7304dbeb14eddb68cf950c1"

[vars]
