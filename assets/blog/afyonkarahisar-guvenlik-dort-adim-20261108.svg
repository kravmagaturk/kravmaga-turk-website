<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
<title id="title">Tehdit anında dört güvenlik adımı</title>
<desc id="desc">Krav Maga Türk güvenlik şeması: Sakin kal, güvenli çıkışa yönel, siper al veya gizlen, güvenli yerde 112'yi ara.</desc>
