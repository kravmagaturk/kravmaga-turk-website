<pattern id="lines" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M0 48L48 0" stroke="#fff" stroke-opacity=".025" stroke-width="1"/></pattern></defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#lines)"/>
