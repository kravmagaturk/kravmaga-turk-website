<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Özel Güvenlik Eğitimi İstanbul | Krav Maga Türk</title>

<meta name="description" content="Özel güvenlik personeline yönelik Krav Maga, yakın temas, farkındalık ve kurumsal güvenlik eğitimleri. Krav Maga Türk güvenlik eğitimleri İstanbul.">

<style>
:root{
    --bg:#050505;
    --bg2:#0b0b0b;
    --card:#111;
    --red:#e81822;
    --text:#f5f5f5;
    --muted:#999;
    --border:#292929;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

.kmt-page{
    width:100%;
    overflow:hidden;
    background:var(--bg);
}

.kmt-wrap{
    width:min(1140px,calc(100% - 38px));
    margin:0 auto;
}

.kmt-section{
    position:relative;
    padding:72px 0;
}

.kmt-dark{
    background:var(--bg2);
    border-top:1px solid #222;
    border-bottom:1px solid #222;
}

.kmt-kicker{
    color:var(--red);
    font-size:11px;
    font-weight:900;
    letter-spacing:2.2px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.kmt-redline{
    width:62px;
    height:3px;
    background:var(--red);
    margin:0 0 22px;
}

.kmt-section-title{
    max-width:800px;
    margin-bottom:35px;
}

.kmt-section-title span{
    display:block;
    color:var(--red);
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.kmt-section-title h2{
    font-size:40px;
    line-height:1.12;
    margin-bottom:12px;
}

.kmt-section-title p{
    color:var(--muted);
    font-size:16px;
}


/* ========================================
   HERO
======================================== */

.kmt-hero{
    position:relative;
    min-height:610px;
    display:flex;
    align-items:center;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(circle at 85% 45%,
        rgba(190,0,0,.22),
        transparent 36%),
        linear-gradient(120deg,#050505,#090909 65%,#140000);
    border-bottom:1px solid var(--border);
}


/*
=================================================
GÜVENLİK HERO GÖRSELİ

Hostinger'a son hazırladığımız:
XRAY + ÖZEL GÜVENLİK

görselini yükledikten sonra aşağıdaki:

url("")

kısmının içine görsel URL'sini koyacağız.

Görsel olmadan da sayfa düzgün çalışır.
=================================================
*/

.kmt-security-photo{
    position:absolute;
    inset:0;
    z-index:-3;

    background-image:url("");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}


/* Görsel üzerindeki sinematik karartma */

.kmt-security-overlay{
    position:absolute;
    inset:0;
    z-index:-2;

    background:
        linear-gradient(
            90deg,
            rgba(5,5,5,.98) 0%,
            rgba(5,5,5,.92) 25%,
            rgba(5,5,5,.72) 43%,
            rgba(5,5,5,.26) 68%,
            rgba(5,5,5,.08) 100%
        ),
        linear-gradient(
            0deg,
            rgba(5,5,5,.55),
            transparent 45%
        );
}


/* GERÇEK 19-48 LOGO */

.kmt-hero-logo{
    position:absolute;
    z-index:-1;

    width:360px;
    height:360px;

    left:4%;
    top:50%;

    transform:translateY(-50%);

    background:
        url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
        center/contain no-repeat;

    opacity:.06;
    filter:grayscale(1);

    pointer-events:none;
}


.kmt-hero-content{
    position:relative;
    z-index:2;
    max-width:650px;
    padding:90px 0;
}


.kmt-hero-badge{
    display:inline-flex;
    align-items:center;
    gap:9px;

    margin-bottom:20px;

    padding:7px 11px;

    background:rgba(10,10,10,.68);
    border:1px solid #363636;
    border-radius:5px;

    color:#bbb;

    font-size:10px;
    font-weight:800;
    letter-spacing:1.4px;

    text-transform:uppercase;
}

.kmt-hero-badge:before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--red);
}


.kmt-hero h1{
    font-size:clamp(44px,6vw,70px);
    line-height:1.01;
    letter-spacing:-2px;

    max-width:650px;

    margin-bottom:20px;
}


.kmt-hero-text{
    max-width:590px;

    color:#b8b8b8;

    font-size:18px;
    line-height:1.65;
}


.kmt-hero-features{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-top:23px;
}


.kmt-hero-feature{
    padding:7px 10px;

    border:1px solid #333;
    border-radius:5px;

    background:rgba(5,5,5,.72);

    color:#aaa;

    font-size:11px;
    font-weight:700;
}


.kmt-actions{
    display:flex;
    flex-wrap:wrap;

    gap:12px;

    margin-top:30px;
}


.kmt-btn{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    min-height:50px;

    padding:0 24px;

    border-radius:7px;

    text-decoration:none;

    font-size:14px;
    font-weight:800;

    transition:.2s ease;
}


.kmt-btn-red{
    background:var(--red);
    color:#fff;

    border:1px solid var(--red);
}


.kmt-btn-red:hover{
    background:#f2222c;
    transform:translateY(-2px);
}


.kmt-btn-dark{
    background:rgba(10,10,10,.82);

    color:#fff;

    border:1px solid #444;
}


.kmt-btn-dark:hover{
    border-color:#888;
}


/* ========================================
   GİRİŞ
======================================== */

.kmt-intro-grid{
    display:grid;

    grid-template-columns:1.15fr .85fr;

    gap:38px;

    align-items:start;
}


.kmt-intro-text h2{
    font-size:38px;
    line-height:1.12;

    margin-bottom:20px;
}


.kmt-intro-text p{
    color:#aaa;

    font-size:16px;

    margin-bottom:18px;
}


.kmt-law{
    background:var(--card);

    border:1px solid #333;
    border-left:3px solid var(--red);

    border-radius:10px;

    padding:28px;
}


.kmt-law small{
    display:block;

    color:var(--red);

    font-size:10px;
    font-weight:900;

    letter-spacing:1.4px;

    text-transform:uppercase;

    margin-bottom:9px;
}


.kmt-law h3{
    font-size:23px;

    margin-bottom:12px;
}


.kmt-law p{
    color:#929292;

    font-size:14px;
}


/* ========================================
   EĞİTİM KARTLARI
======================================== */

.kmt-card-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:14px;
}


.kmt-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:11px;

    padding:25px;

    min-height:215px;

    transition:.2s ease;
}


.kmt-card:hover{
    border-color:#555;

    transform:translateY(-3px);
}


.kmt-card-number{
    color:var(--red);

    font-size:11px;
    font-weight:900;

    letter-spacing:1px;

    margin-bottom:19px;
}


.kmt-card h3{
    font-size:18px;

    line-height:1.25;

    margin-bottom:10px;
}


.kmt-card p{
    color:#8d8d8d;

    font-size:14px;
}


/* ========================================
   YAKIN TEMAS
======================================== */

.kmt-contact{
    position:relative;

    overflow:hidden;
}


.kmt-contact:after{
    content:"";

    position:absolute;

    width:430px;
    height:430px;

    right:-80px;
    bottom:-130px;

    background:
        url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
        center/contain no-repeat;

    opacity:.035;

    filter:grayscale(1);

    pointer-events:none;
}


.kmt-contact-grid{
    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:.8fr 1.2fr;

    gap:35px;
}


.kmt-contact-title h2{
    font-size:39px;

    line-height:1.1;

    margin-bottom:15px;
}


.kmt-contact-title p{
    color:#999;

    font-size:15px;
}


.kmt-modules{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}


.kmt-module{
    background:#080808;

    border:1px solid var(--border);

    border-radius:8px;

    padding:19px;
}


.kmt-module small{
    display:block;

    color:var(--red);

    font-size:10px;
    font-weight:900;

    margin-bottom:7px;
}


.kmt-module strong{
    display:block;

    font-size:15px;

    margin-bottom:4px;
}


.kmt-module p{
    color:#777;

    font-size:12px;
}


/* ========================================
   GÜVENLİK YAKLAŞIMI
======================================== */

.kmt-process{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:10px;
}


.kmt-process-item{
    background:#101010;

    border:1px solid var(--border);

    border-radius:9px;

    padding:23px 17px;

    text-align:center;
}


.kmt-process-number{
    width:36px;
    height:36px;

    margin:0 auto 13px;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:var(--red);

    color:#fff;

    font-size:11px;
    font-weight:900;
}


.kmt-process-item h3{
    font-size:15px;

    margin-bottom:5px;
}


.kmt-process-item p{
    color:#777;

    font-size:12px;
}


/* ========================================
   PROJELER
======================================== */

.kmt-project-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:10px;
}


.kmt-project{
    display:flex;

    align-items:center;

    gap:13px;

    background:#101010;

    border:1px solid var(--border);

    border-radius:8px;

    padding:16px 18px;
}


.kmt-project-mark{
    flex:0 0 auto;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--red);
}


.kmt-project span{
    color:#bbb;

    font-size:13px;
}


/* ========================================
   MARKA
======================================== */

.kmt-brand-note{
    padding:25px;

    background:#0d0d0d;

    border:1px solid var(--border);

    border-radius:9px;

    color:#888;

    font-size:13px;
}


.kmt-brand-note strong{
    color:#ddd;
}


/* ========================================
   CTA
======================================== */

.kmt-cta{
    position:relative;

    overflow:hidden;

    padding:82px 0;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 110%,
            rgba(190,0,0,.22),
            transparent 50%
        ),
        var(--bg);
}


.kmt-cta:before{
    content:"";

    position:absolute;

    width:390px;
    height:390px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
        center/contain no-repeat;

    opacity:.045;

    filter:grayscale(1);
}


.kmt-cta-content{
    position:relative;

    z-index:2;
}


.kmt-cta h2{
    font-size:44px;

    line-height:1.1;

    margin-bottom:13px;
}


.kmt-cta p{
    max-width:650px;

    margin:0 auto;

    color:#929292;
}


.kmt-cta .kmt-actions{
    justify-content:center;
}


/* ========================================
   TABLET
   751 - 1100
======================================== */

@media(min-width:751px) and (max-width:1100px){

    .kmt-wrap{
        width:calc(100% - 46px);
    }

    .kmt-hero{
        min-height:520px;
    }

    .kmt-security-photo{
        background-position:58% center;
    }

    .kmt-security-overlay{
        background:
            linear-gradient(
                90deg,
                rgba(5,5,5,.97) 0%,
                rgba(5,5,5,.88) 35%,
                rgba(5,5,5,.45) 67%,
                rgba(5,5,5,.12) 100%
            );
    }

    .kmt-hero-content{
        max-width:550px;

        padding:65px 0;
    }

    .kmt-hero h1{
        font-size:42px;

        letter-spacing:-1px;
    }

    .kmt-hero-text{
        max-width:510px;

        font-size:15px;
    }

    .kmt-hero-logo{
        width:400px;
        height:400px;
        right:-35px;
        left:auto;
        opacity:.07;
    }

    .kmt-section{
        padding:55px 0;
    }

    .kmt-section-title h2,
    .kmt-contact-title h2,
    .kmt-intro-text h2{
        font-size:31px;
    }

    .kmt-section-title p,
    .kmt-intro-text p{
        font-size:14px;
    }

    .kmt-card-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .kmt-card{
        min-height:190px;
    }

    .kmt-process-item{
        padding:18px 9px;
    }

    .kmt-process-item h3{
        font-size:13px;
    }

    .kmt-cta h2{
        font-size:32px;
    }
}


/* ========================================
   MOBİL
======================================== */

@media(max-width:750px){

    .kmt-wrap{
        width:calc(100% - 28px);
    }

    .kmt-hero{
        min-height:620px;

        align-items:flex-end;
    }

    /*
    MOBİL HERO KADRAJI

    Ana güvenlik personeli görünür.
    X-Ray'in bir bölümü solda kalır.
    */

    .kmt-security-photo{
        background-size:auto 390px;

        background-position:61% top;

        background-repeat:no-repeat;
    }

    .kmt-security-overlay{
        background:
            linear-gradient(
                0deg,
                rgba(5,5,5,1) 0%,
                rgba(5,5,5,.97) 27%,
                rgba(5,5,5,.76) 48%,
                rgba(5,5,5,.17) 77%,
                rgba(5,5,5,.10) 100%
            );
    }

    .kmt-hero-logo{
        width:320px;
        height:320px;
        right:-120px;
        left:auto;
        top:34%;
        opacity:.065;
    }

    .kmt-hero-content{
        width:100%;

        max-width:100%;

        padding:290px 0 43px;
    }

    .kmt-kicker{
        font-size:9px;

        letter-spacing:1.5px;
    }

    .kmt-hero-badge{
        font-size:9px;

        margin-bottom:14px;
    }

    .kmt-hero h1{
        max-width:350px;

        font-size:30px;

        line-height:1.08;

        letter-spacing:-.5px;

        margin-bottom:15px;
    }

    .kmt-redline{
        width:46px;

        margin-bottom:17px;
    }

    .kmt-hero-text{
        max-width:350px;

        font-size:14px;

        line-height:1.55;
    }
