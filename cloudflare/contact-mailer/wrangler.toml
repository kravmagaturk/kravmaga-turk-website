name = "kmt-contact-mailer"
main = "worker.js"
compatibility_date = "2026-10-04"
workers_dev = true

[vars]
HOSTINGER_MAILBOX_ID = "AC19b143db0562636e22bddab9bbc7"

[observability]
enabled = true

# Approximate per-location abuse control in addition to the existing per-instance limit.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "120156"

[ratelimits.simple]
limit = 3
period = 60
