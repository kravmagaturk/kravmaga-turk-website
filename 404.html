<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sayfa Bulunamadı | Krav Maga Türk</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. Krav Maga Türk ana sayfasına veya iletişim bölümüne dönebilirsiniz.">
<style>
html,body{margin:0;min-height:100%;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif}
main{min-height:72vh;display:grid;place-items:center;padding:48px 20px;text-align:center}
.wrap{width:min(680px,100%)}
.code{font-size:clamp(72px,16vw,150px);font-weight:900;line-height:.9;color:#e30620;letter-spacing:-5px}
h1{font-size:clamp(30px,6vw,48px);margin:20px 0 12px}
p{color:#aaa;line-height:1.7;margin:0 auto 26px;max-width:560px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:8px;text-decoration:none;font-weight:800}
.primary{background:#e30620;color:#fff}
.secondary{border:1px solid #444;color:#fff;background:#111315}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Sayfa Bulunamadı</h1>
    <p>Aradığınız adres taşınmış, değiştirilmiş veya artık mevcut olmayabilir.</p>
    <div class="actions">
      <a class="primary" href="/">Ana Sayfa</a>
      <a class="secondary" href="/iletisim">İletişim</a>
    </div>
  </div>
</main>
<script src="/assets/footer.js" defer></script>
</body>
</html>
