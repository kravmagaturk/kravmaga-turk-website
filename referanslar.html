<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referanslar | Krav Maga Türk</title>
<style id="kmt-mobile-final">
html{box-sizing:border-box;overflow-x:hidden}*,*:before,*:after{box-sizing:inherit}body{overflow-x:hidden}img,video,iframe{max-width:100%;height:auto}a,button{touch-action:manipulation}
@media(max-width:750px){.kmt-wrap,.wrap,.leg-wrap,.kmt-ref-wrap{width:min(100% - 32px,1200px)!important;margin-left:auto!important;margin-right:auto!important}.kmt-actions,.leg-actions{flex-wrap:wrap}.kmt-btn,.leg-btn{min-height:46px}.kmt-actions .kmt-btn,.leg-actions .leg-btn{max-width:100%}}
</style>
</head>
<body style="margin:0;background:#050505">
<style>
:root{
  --bg:#050505;
  --bg2:#0b0b0b;
  --card:#111;
  --red:#e81822;
  --text:#f5f5f5;
  --muted:#999;
  --border:#292929;
}

*{box-sizing:border-box}

.kmt-ref{
  width:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.kmt-ref-wrap{
  width:min(1160px,calc(100% - 40px));
  margin:auto;
}


/* HERO */

.kmt-ref-hero{
  position:relative;
  min-height:500px;
  display:flex;
  align-items:center;
  overflow:hidden;
  isolation:isolate;

  background:
    radial-gradient(circle at 80% 45%,
      rgba(232,24,34,.18),
      transparent 35%),
    linear-gradient(120deg,#050505,#090909 70%,#160000);

  border-bottom:1px solid var(--border);
}

.kmt-ref-hero:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-3;

  background:
    linear-gradient(
      90deg,
      rgba(5,5,5,.99),
      rgba(5,5,5,.87) 57%,
      rgba(5,5,5,.32)
    );
}

.kmt-ref-watermark{
  position:absolute;
  z-index:-2;

  width:500px;
  height:500px;

  right:3%;
  top:50%;
  transform:translateY(-50%);

  background:
    url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
    center/contain no-repeat;

  opacity:.10;
  filter:grayscale(1);
}

.kmt-ref-content{
  position:relative;
  z-index:2;
  max-width:760px;
  padding:80px 0;
}

.kmt-ref-kicker{
  margin-bottom:12px;
  color:var(--red);
  font-size:11px;
  font-weight:900;
  letter-spacing:2.2px;
}

.kmt-ref h1{
  margin:0 0 18px;
  color:#fff;
  font-size:clamp(45px,7vw,72px);
  line-height:1;
  letter-spacing:-2px;
}

.kmt-ref-line{
  width:65px;
  height:4px;
  margin-bottom:22px;
  background:var(--red);
}

.kmt-ref-lead{
  max-width:650px;
  margin:0;
  color:#aaa;
  font-size:17px;
  line-height:1.7;
}


/* GENEL */

.kmt-ref-section{
  padding:70px 0;
}

.kmt-ref-alt{
  background:var(--bg2);
  border-top:1px solid #1d1d1d;
  border-bottom:1px solid #1d1d1d;
}

.kmt-ref-heading{
  max-width:780px;
  margin-bottom:34px;
}

.kmt-ref-heading span{
  display:block;
  margin-bottom:7px;
  color:var(--red);
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.kmt-ref-heading h2{
  margin:0 0 12px;
  color:#fff;
  font-size:36px;
  line-height:1.15;
}

.kmt-ref-heading p{
  margin:0;
  color:#888;
  font-size:14px;
  line-height:1.7;
}


/* ÖNE ÇIKAN KARTLAR */

.kmt-ref-featured{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.kmt-ref-feature{
  min-height:155px;
  padding:22px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#111;
}

.kmt-ref-feature b{
  display:block;
  margin-bottom:17px;

  color:var(--red);
  font-size:10px;
  letter-spacing:1.3px;
}

.kmt-ref-feature h3{
  margin:0 0 7px;

  color:#fff;
  font-size:16px;
  line-height:1.3;
}

.kmt-ref-feature p{
  margin:0;

  color:#777;
  font-size:12px;
  line-height:1.55;
}


/* KATEGORİ */

.kmt-ref-category{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:38px;

  padding:30px 0;

  border-bottom:1px solid #202020;
}

.kmt-ref-category:first-child{
  padding-top:0;
}

.kmt-ref-category:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.kmt-ref-category-title span{
  display:block;
  margin-bottom:5px;

  color:var(--red);
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
}

.kmt-ref-category-title h3{
  margin:0;

  color:#fff;
  font-size:19px;
}

.kmt-ref-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.kmt-ref-item{
  position:relative;

  min-height:64px;

  display:flex;
  align-items:center;

  padding:13px 15px 13px 35px;

  border:1px solid #252525;
  border-radius:7px;

  background:#0e0e0e;

  color:#bbb;

  font-size:13px;
  line-height:1.45;
}

.kmt-ref-item:before{
  content:"";

  position:absolute;

  width:6px;
  height:6px;

  left:17px;

  border-radius:50%;

  background:var(--red);
}


/* TARİHSEL */

.kmt-ref-timeline{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.kmt-ref-time{
  padding:22px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#111;
}

.kmt-ref-time span{
  display:block;

  margin-bottom:8px;

  color:var(--red);

  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
}

.kmt-ref-time h3{
  margin:0 0 6px;

  color:#fff;

  font-size:16px;
}

.kmt-ref-time p{
  margin:0;

  color:#777;

  font-size:12px;
  line-height:1.55;
}


/* HİKAYE */

.kmt-ref-story{
  display:grid;

  grid-template-columns:170px 1fr;

  gap:35px;

  align-items:center;

  max-width:900px;
}

.kmt-ref-story-logo{
  width:170px;
  height:170px;

  background:
    url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
    center/contain no-repeat;
}

.kmt-ref-story h2{
  margin:0 0 13px;

  color:#fff;

  font-size:32px;
}

.kmt-ref-story p{
  margin:0 0 13px;

  color:#999;

  font-size:14px;
  line-height:1.75;
}


/* CTA */

.kmt-ref-cta{
  position:relative;

  overflow:hidden;

  padding:75px 20px;

  text-align:center;

  background:
    radial-gradient(circle at 50% 120%,
      rgba(232,24,34,.24),
      transparent 50%),
    #050505;

  border-top:1px solid var(--border);
}

.kmt-ref-cta:before{
  content:"";

  position:absolute;

  width:350px;
  height:350px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:
    url("https://raw.githubusercontent.com/kravmagaturk/international-register/main/logo.png")
    center/contain no-repeat;

  opacity:.035;
  filter:grayscale(1);
}

.kmt-ref-cta-inner{
  position:relative;
  z-index:2;

  max-width:680px;
  margin:auto;
}

.kmt-ref-cta h2{
  margin:0 0 12px;

  color:#fff;

  font-size:35px;
}

.kmt-ref-cta p{
  margin:0 auto 24px;

  color:#999;

  font-size:14px;
}

.kmt-ref-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
}

.kmt-ref-btn{
  min-height:49px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:0 22px;

  border-radius:7px;

  font-size:13px;
  font-weight:900;

  text-decoration:none;
}

.kmt-ref-btn-red{
  background:var(--red);
  color:#fff;
}

.kmt-ref-btn-dark{
  background:#111;
  border:1px solid #444;
  color:#fff;
}


/* TABLET */

@media(min-width:751px) and (max-width:1100px){

  .kmt-ref-wrap{
    width:calc(100% - 46px);
  }

  .kmt-ref-hero{
    min-height:460px;
  }

  .kmt-ref h1{
    font-size:50px;
  }

  .kmt-ref-watermark{
    width:360px;
    height:360px;
    right:-30px;
  }

  .kmt-ref-section{
    padding:55px 0;
  }

  .kmt-ref-featured{
    grid-template-columns:repeat(2,1fr);
  }

  .kmt-ref-category{
    grid-template-columns:180px 1fr;
    gap:25px;
  }

}


/* MOBILE */

@media(max-width:750px){

  .kmt-ref-wrap{
    width:calc(100% - 28px);
  }

  .kmt-ref-hero{
    min-height:470px;
  }

  .kmt-ref-content{
    padding:60px 0 52px;
  }

  .kmt-ref h1{
    font-size:36px;
    letter-spacing:-1px;
  }

  .kmt-ref-lead{
    max-width:350px;
    font-size:14px;
  }

  .kmt-ref-watermark{
    width:260px;
    height:260px;

    right:-105px;
    top:31%;

    opacity:.07;
  }

  .kmt-ref-section{
    padding:45px 0;
  }

  .kmt-ref-heading h2{
    font-size:25px;
  }

  .kmt-ref-featured{
    grid-template-columns:1fr 1fr;
  }

  .kmt-ref-category{
    grid-template-columns:1fr;
    gap:15px;
  }

  .kmt-ref-list{
    grid-template-columns:1fr;
  }

  .kmt-ref-timeline{
    grid-template-columns:1fr;
  }

  .kmt-ref-story{
    grid-template-columns:1fr;
    text-align:center;
  }

  .kmt-ref-story-logo{
    margin:auto;
  }

  .kmt-ref-story h2{
    font-size:25px;
  }

  .kmt-ref-btn{
    width:100%;
  }

  .kmt-ref-cta h2{
    font-size:26px;
  }

}


@media(max-width:420px){

  .kmt-ref-featured{
    grid-template-columns:1fr;
  }

  .kmt-ref h1{
    font-size:33px;
  }

}
</style>


<main class="kmt-ref">


<!-- HERO -->


</main>

</html>
