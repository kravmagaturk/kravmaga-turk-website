<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="/assets/brand/logo-1948.png">
<link rel="apple-touch-icon" href="/assets/brand/logo-1948.png">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://kravmaga-diploma-default-rtdb.firebaseio.com; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="description" content="Krav Maga Türk diploma ve belge doğrulama sonucu.">
<link rel="canonical" href="https://kravmaga.com.tr/diploma-dogrula.html">
<title>Diploma Doğrulama | Krav Maga Türk</title>
<style>
:root{color-scheme:dark;--bg:#080808;--card:#111;--line:#2b2b2b;--text:#f3f3f3;--muted:#aaa;--red:#e51b23;--ok:#bfe7c5}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding:24px 14px 40px}.wrap{width:min(720px,100%);margin:auto}.brand{text-align:center;margin:8px 0 22px}.brand h1{font-size:22px;margin:0 0 4px}.brand p{font-size:12px;color:#777;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.status{text-align:center;margin:0 0 20px}.badge{display:inline-block;padding:10px 18px;border-radius:999px;background:#e7f6e8;color:#34763e;font-weight:800}
.photo{width:128px;height:154px;object-fit:cover;border-radius:9px;border:1px solid #333;display:block;margin:0 auto 12px}.name{text-align:center;font-size:27px;font-weight:900;margin:0 0 18px}
.row{display:grid;grid-template-columns:180px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid #292929}.row:last-child{border-bottom:0}.label{font-weight:800;color:#9b9b9b}.value{text-align:right;overflow-wrap:anywhere}
.verify{margin-top:20px;padding-top:18px;border-top:1px solid #303030;color:#858585;font-size:12px;line-height:1.55;text-align:center}
.msg{text-align:center;padding:28px 10px;color:#aaa}.error{color:#ff9696}
@media(max-width:600px){body{padding:12px 8px 28px}.card{padding:18px 14px}.row{grid-template-columns:1fr;gap:5px}.value{text-align:left;font-size:18px}.name{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>KRAV MAGA TÜRK</h1><p>Belge / Diploma Doğrulama</p></div>
  <div id="card" class="card"><div class="msg">Kayıt doğrulanıyor…</div></div>
</div>
<script>
(function(){
  'use strict';
  var FIREBASE='https://kravmaga-diploma-default-rtdb.firebaseio.com';
  var p=new URLSearchParams(location.search);
  var reg=String(p.get('reg')||'').trim().toUpperCase();
  var card=document.getElementById('card');

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function inactive(v){v=String(v||'').toLocaleLowerCase('tr-TR');return v.indexOf('faal olmayan')>=0||v==='pasif'||v==='inactive';}
  function duration(dateText){
    if(!dateText)return '';
    var m=String(dateText).match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if(!m)return '';
    var start=new Date(Number(m[3]),Number(m[2])-1,Number(m[1])); if(isNaN(start.getTime()))return '';
    var now=new Date(); if(start>now)return '';
    var y=now.getFullYear()-start.getFullYear(), mo=now.getMonth()-start.getMonth(), d=now.getDate()-start.getDate();
    if(d<0){mo--;var prev=new Date(now.getFullYear(),now.getMonth(),0);d+=prev.getDate();}
    if(mo<0){y--;mo+=12;}
    return y+' Yıl '+mo+' Ay '+d+' Gün';
  }
  function normalize(raw){
    if(!raw||typeof raw!=='object')return null;
    if(raw.studentName||raw.registerNo)return raw;
    var vals=Object.keys(raw).map(function(k){return raw[k];}).filter(function(x){return x&&typeof x==='object';});
    return vals.find(function(x){return String(x.registerNo||'').toUpperCase()===reg;})||(vals.length===1?vals[0]:null);
  }
  function render(d){
    var st=inactive(d.status)?'Faal Olmayan':'Faal';
    var loc=[d.country,d.city,d.district].filter(Boolean).join(' / ')||'-';
    var dur=duration(d.joinDate);
    var img=d.webPortrait||'';
    card.innerHTML=
      (img?'<img class="photo" src="'+esc(img)+'" alt="">':'')+
      '<div class="name">'+esc(d.studentName||'-')+'</div>'+
      '<div class="status"><span class="badge">'+esc(st)+'</span></div>'+
      '<div class="row"><div class="label">Ad Soyad</div><div class="value">'+esc(d.studentName||'-')+'</div></div>'+
      '<div class="row"><div class="label">Sicil No</div><div class="value">'+esc(d.registerNo||reg)+'</div></div>'+
      '<div class="row"><div class="label">Lokasyon</div><div class="value">'+esc(loc)+'</div></div>'+
      '<div class="row"><div class="label">Seviyesi</div><div class="value">'+esc(d.level||'-')+'</div></div>'+
      (d.joinDate?'<div class="row"><div class="label">Akademiye Giriş Tarihi</div><div class="value">'+esc(d.joinDate)+'</div></div>':'')+
      (dur?'<div class="row"><div class="label">Eğitim Süresi</div><div class="value">'+esc(dur)+'</div></div>':'')+
      '<div class="row"><div class="label">Durum</div><div class="value">'+esc(st)+'</div></div>'+
      '<div class="verify">Bu ekran yalnızca belge doğrulama içindir. Yönetim paneli, kaynak araçları ve diploma indirme işlevleri bu doğrulama sayfasında bulunmaz.</div>';
  }
  if(!/^[A-Z0-9_-]{3,40}$/.test(reg)){card.innerHTML='<div class="msg error">Geçersiz doğrulama bağlantısı.</div>';return;}
  fetch(FIREBASE+'/publicDiplomaData/'+encodeURIComponent(reg)+'.json',{cache:'no-store',credentials:'omit'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(raw){var d=normalize(raw);if(!d||!d.studentName)throw new Error('not-found');render(d);})
    .catch(function(){card.innerHTML='<div class="msg error">Kayıt bulunamadı veya doğrulama servisine ulaşılamadı.</div>';});
})();
</script>
</body>
</html>
